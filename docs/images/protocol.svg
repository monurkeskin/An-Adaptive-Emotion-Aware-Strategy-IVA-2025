<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="142" viewBox="0 0 1000 142" role="img" aria-labelledby="title desc"><title id="title">Research companion workflow</title><desc id="desc">Paper configuration leads to isolated sessions, durable records, then analysis and citations. Synthetic and original-result scopes remain explicit.</desc><rect width="1000" height="142" fill="#f4f8f6"/><rect x="16" y="35" width="224" height="65" rx="12" fill="#ffffff" stroke="#236d60" stroke-width="2"/><text x="128" y="74" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#173d34">Configure</text><path d="M245 67 h14 l-5 -5 m5 5 l-5 5" fill="none" stroke="#236d60" stroke-width="2"/><rect x="264" y="35" width="224" height="65" rx="12" fill="#ffffff" stroke="#236d60" stroke-width="2"/><text x="376" y="74" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#173d34">Practice / sessions</text><path d="M493 67 h14 l-5 -5 m5 5 l-5 5" fill="none" stroke="#236d60" stroke-width="2"/><rect x="512" y="35" width="224" height="65" rx="12" fill="#ffffff" stroke="#236d60" stroke-width="2"/><text x="624" y="74" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#173d34">Durable records</text><path d="M741 67 h14 l-5 -5 m5 5 l-5 5" fill="none" stroke="#236d60" stroke-width="2"/><rect x="760" y="35" width="224" height="65" rx="12" fill="#ffffff" stroke="#236d60" stroke-width="2"/><text x="872" y="74" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#173d34">Analysis / citation</text></svg>